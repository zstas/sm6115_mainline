%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt37701.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT37701 based DSI Panels

maintainers:
  - Stanislav Zaikin <zstaseg@gmail.com>

description:
  Command mode AMOLED panels based on the Novatek NT37701 display controller,
  found in the Xiaomi 12 Lite 5G (taoyao).

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      - csot,nt37701-taoyao
      - tianma,nt37701-taoyao

  reg:
    maxItems: 1
    description: DSI virtual channel

  vdd-supply: true
  vddio-supply: true
  dvdd-supply: true
  port: true
  reset-gpios: true

required:
  - compatible
  - reg
  - vdd-supply
  - vddio-supply
  - dvdd-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "csot,nt37701-taoyao";
            reg = <0>;

            vdd-supply = <&vreg_l13c_3p0>;
            vddio-supply = <&vreg_l12c_1p8>;
            dvdd-supply = <&vreg_oled_dvdd>;

            reset-gpios = <&tlmm 44 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
