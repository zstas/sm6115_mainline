%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/xiaomi,taoyao-csot-nt36672c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi Taoyao CSOT NT36672C AMOLED DSI Panel

maintainers:
  - Stanislav Zaikin <zstaseg@gmail.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: xiaomi,taoyao-csot-nt36672c

  reg:
    maxItems: 1
    description: DSI virtual channel

  vdd-supply: true
  vddio-supply: true
  dvdd-supply: true
  port: true
  reset-gpios: true

required:
  - compatible
  - reg
  - vdd-supply
  - vddio-supply
  - dvdd-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    dsi {
        #address-cells = <1>;
        #size-cells = <0>;
        panel@0 {
            compatible = "xiaomi,taoyao-csot-nt36672c";
            reg = <0>;

            reset-gpios = <&tlmm 44 GPIO_ACTIVE_LOW>;

            vdd-supply = <&vreg_l13c_3p0>;
            vddio-supply = <&vreg_l12c_1p8>;
            dvdd-supply = <&vreg_oled_dvdd>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };
